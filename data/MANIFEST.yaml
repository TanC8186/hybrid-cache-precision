    license: "CC-BY-SA-3.0 / GFDL（wikitext 数据集）"
    preprocessing: "scripts/fetch_wikitext.py --max-docs 800；取 800 篇非空文档，\\n\\n 拼接"
  c4_slice.txt:
    sha256: "7ee17255c5340d08cb9648b3d582794580c0db8902b6cd682433492eed07eb08"
