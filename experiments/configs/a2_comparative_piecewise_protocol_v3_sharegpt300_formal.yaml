schema_version: 1
name: a2_comparative_piecewise_protocol_v3_sharegpt300_formal_2b

environment:
  vllm_executable: /root/autodl-tmp/MLSys_Research/.venv/bin/vllm
  vllm_source_dir: vendor/vllm
  model_path: /root/autodl-tmp/caches/modelscope/models/Qwen--Qwen3.5-2B/snapshots/master
  env:
    VLLM_USE_FLASHINFER_SAMPLER: "0"
    PYTHONUNBUFFERED: "1"
    VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "75"

server:
  host: 127.0.0.1
  port: 8000
  health_path: /health
  startup_timeout_s: 600
  health_poll_interval_s: 2
  stabilization_s: 5
  shutdown_grace_s: 30
  args:
    - --max-model-len
    - "4096"
    - --gpu-memory-utilization
    - "0.85"
    - --seed
    - "42"

protocol:
  protocol_version: 3
  request_failure_policy: count_as_slo_miss
  benchmark_client_keepalive_timeout_s: 60
  warmup_requests: 120
  measurement_window_s: 300
  max_concurrency: null
  ttft_thresholds_ms: [250, 500, 1000, 2000, 3000]
  tpot_threshold_ms: 200
  sustainable_goodput_ratio: 0.95
  arrival_window_tolerance_fraction: 0.10
  goodput_crosscheck_abs_tolerance: 0.02
  sample_timeout_s: 1200
  require_clean_git: true

allocations:
  fp16:
    server_args:
      - --kv-cache-dtype
      - auto
      - --compilation-config
      - '{"cudagraph_mode":"PIECEWISE"}'
    required_log_substrings:
      - CUDAGraphMode.PIECEWISE
  int4:
    server_args:
      - --kv-cache-dtype
      - int4_per_token_head
      - --compilation-config
      - '{"cudagraph_mode":"PIECEWISE"}'
    required_log_substrings:
      - int4_per_token_head
      - CUDAGraphMode.PIECEWISE
  packed_per_layer:
    server_args:
      - --kv-cache-dtype
      - int4_per_token_head
      - --kv-cache-dtype-per-layer
      - '{"23":"auto","3":"int4_per_token_head","7":"int4_per_token_head","11":"int4_per_token_head","15":"int4_per_token_head","19":"int4_per_token_head"}'
      - --enable-per-layer-page-groups
      - --compilation-config
      - '{"cudagraph_mode":"PIECEWISE"}'
    required_log_substrings:
      - enable_per_layer_page_groups
      - kv_cache_dtype_per_layer
      - CUDAGraphMode.PIECEWISE

workloads:
  sharegpt:
    dataset_name: sharegpt
    dataset_path: /root/autodl-tmp/caches/sharegpt/ShareGPT_V3_unfiltered_cleaned_split.json
    sharegpt_output_len: null
    ignore_eos: true
    no_oversample: true

phases:
  comparative_sharegpt300_formal_v3:
    allocations: [fp16, int4, packed_per_layer]
    seeds: [7, 42, 2026]
    workload_rates:
      sharegpt: [20, 25, 30, 35, 40, 45, 50]
